<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilgrim's Pace</title>
<meta name="description" content="Pilgrim's Pace">
<meta property="og:title" content="Pilgrim's Pace">
<meta property="og:image" content="https://images.pexels.com/photos/13398540/pexels-photo-13398540.jpeg?auto=compress&cs=tinysrgb&w=1600">
<meta name="theme-color" content="#070707">
<style>
:root{
  --fg:#fff;
  --muted:rgba(255,255,255,.74);
  --line:rgba(255,255,255,.34);
  --glass:rgba(5,5,5,.44);
  --glass2:rgba(5,5,5,.78);
  --safe-t:max(18px,env(safe-area-inset-top));
  --safe-r:max(18px,env(safe-area-inset-right));
  --safe-b:max(18px,env(safe-area-inset-bottom));
  --safe-l:max(18px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:var(--fg);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
button,a{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:#050505}

/* Real photographic rooms */
.room{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .72s ease,visibility .72s ease;
  background:#050505 center/cover no-repeat;
}
.room::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.18),transparent 24%,transparent 68%,rgba(0,0,0,.28)),
    radial-gradient(circle at center,transparent 48%,rgba(0,0,0,.16) 100%);
}
.room.active{opacity:1;visibility:visible;pointer-events:auto}
#front{background-image:url("https://images.pexels.com/photos/13398540/pexels-photo-13398540.jpeg?auto=compress&cs=tinysrgb&w=2400")}
#drive{background-image:url("https://images.pexels.com/photos/14749802/pexels-photo-14749802.jpeg?auto=compress&cs=tinysrgb&w=2400")}
#fountain{background-image:url("https://images.pexels.com/photos/30400180/pexels-photo-30400180.jpeg?auto=compress&cs=tinysrgb&w=2200")}
#studio{background-image:url("https://images.pexels.com/photos/7586656/pexels-photo-7586656.jpeg?auto=compress&cs=tinysrgb&w=2200")}
#home{background-image:url("https://images.pexels.com/photos/32418264/pexels-photo-32418264.jpeg?auto=compress&cs=tinysrgb&w=2200")}

/* Arrows */
.arrow{
  position:absolute;z-index:12;
  width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(255,255,255,.76);
  background:rgba(0,0,0,.15);
  backdrop-filter:blur(4px);
  display:grid;place-items:center;
  cursor:pointer;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.arrow::before{
  content:"→";
  font-size:26px;line-height:1;font-weight:300;
  transform:translateY(-1px);
}
.arrow:hover{transform:scale(1.06);background:rgba(0,0,0,.35)}
.arrow:focus-visible{outline:2px solid #fff;outline-offset:4px}
.arrow[data-label]::after{
  content:attr(data-label);
  position:absolute;top:50%;left:64px;transform:translateY(-50%);
  padding:7px 9px;border-radius:999px;
  background:rgba(0,0,0,.52);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16);
  color:#fff;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .16s ease;
}
.arrow:hover::after{opacity:1}

/* Main Downtown scene hotspots */
#front .to-drive{left:13%;bottom:18%}
#front .to-fountain{left:53%;top:57%}
#front .to-studio{right:17%;top:27%}
#front .to-home{right:8%;bottom:17%}

/* Back / next inside rooms */
.room-nav{
  position:absolute;z-index:15;inset:0;pointer-events:none;
}
.room-nav .arrow{pointer-events:auto}
.back{left:var(--safe-l);bottom:var(--safe-b)}
.back::before{content:"←"}
.next{right:var(--safe-r);bottom:var(--safe-b)}

.room-name{
  position:absolute;z-index:14;right:var(--safe-r);top:var(--safe-t);
  padding:9px 11px;border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.26);backdrop-filter:blur(8px);border-radius:999px;
  color:rgba(255,255,255,.86);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
}

/* Studio drawer */
.release{
  position:absolute;z-index:20;right:clamp(16px,4vw,62px);top:50%;transform:translateY(-50%);
  width:min(360px,calc(100vw - 32px));
  padding:13px;border-radius:20px;border:1px solid rgba(255,255,255,.16);
  background:var(--glass2);backdrop-filter:blur(22px);
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.release img{
  width:100%;aspect-ratio:1;object-fit:cover;display:block;
  border-radius:13px;margin-bottom:12px;box-shadow:0 16px 40px rgba(0,0,0,.36);
}
.services{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.service{
  min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 12px;border:1px solid rgba(255,255,255,.13);
  border-radius:12px;text-decoration:none;background:rgba(255,255,255,.025);
  font-size:12px;
}
.service span:last-child{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.service:hover{background:rgba(255,255,255,.07)}

/* Tiny navigator, mostly for mobile */
.dock{
  position:absolute;z-index:30;left:50%;bottom:var(--safe-b);transform:translateX(-50%);
  display:flex;gap:6px;padding:7px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.34);backdrop-filter:blur(14px);
  border-radius:999px;
}
.dock button{
  border:0;background:transparent;color:rgba(255,255,255,.65);
  padding:8px 10px;border-radius:999px;
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
}
.dock button.active{background:rgba(255,255,255,.10);color:#fff}

/* front should feel clean */
body[data-room="front"] .dock{opacity:.72}
body[data-room="studio"] .dock{display:none}

@media(max-width:820px){
  .release{
    left:14px;right:14px;top:auto;bottom:82px;transform:none;width:auto;
    max-height:74vh;overflow:auto
  }
  .services{grid-template-columns:1fr}
  .dock{max-width:calc(100vw - 28px);overflow:auto;justify-content:flex-start}
  .dock::-webkit-scrollbar{display:none}
  .dock button{white-space:nowrap}
  .room-name{top:var(--safe-t);right:var(--safe-r)}
}
@media(max-width:600px){
  .arrow{width:46px;height:46px}
  .arrow::before{font-size:23px}
  .arrow[data-label]::after{display:none}
  #front .to-drive{left:8%;bottom:19%}
  #front .to-fountain{left:50%;top:58%}
  #front .to-studio{right:12%;top:25%}
  #front .to-home{right:7%;bottom:18%}
}
@media(prefers-reduced-motion:reduce){
  .room{transition:none}
  .arrow{transition:none}
}
</style>
</head>
<body data-room="front">
<div id="app">

  <section id="front" class="room active" aria-label="Downtown Dubai">
    <button class="arrow to-drive" data-go="drive" data-label="Drive" aria-label="Open Drive"></button>
    <button class="arrow to-fountain" data-go="fountain" data-label="Fountain" aria-label="Open Fountain"></button>
    <button class="arrow to-studio" data-go="studio" data-label="Studio" aria-label="Open Studio"></button>
    <button class="arrow to-home" data-go="home" data-label="Home" aria-label="Open Home"></button>
  </section>

  <section id="drive" class="room" aria-label="Dubai night drive">
    <div class="room-name">Drive</div>
    <div class="room-nav">
      <button class="arrow back" data-go="front" aria-label="Back to Downtown"></button>
      <button class="arrow next" data-go="fountain" aria-label="Next room"></button>
    </div>
  </section>

  <section id="fountain" class="room" aria-label="Dubai Fountain">
    <div class="room-name">Fountain</div>
    <div class="room-nav">
      <button class="arrow back" data-go="front" aria-label="Back to Downtown"></button>
      <button class="arrow next" data-go="studio" aria-label="Next room"></button>
    </div>
  </section>

  <section id="studio" class="room" aria-label="Studio">
    <div class="room-name">Studio</div>
    <div class="room-nav">
      <button class="arrow back" data-go="front" aria-label="Back to Downtown"></button>
      <button class="arrow next" data-go="home" aria-label="Next room"></button>
    </div>

    <div class="release" aria-label="Listen">
      <img src="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg" alt="Pilgrim's Pace cover artwork">
      <div class="services">
        <a class="service" href="https://open.spotify.com/track/7lAKKJmumRbe8TNYyafqcz?si=8Lk2luENT92Kbbb_65MvcQ&utm_source=copy-link" target="_blank" rel="noopener noreferrer"><span>Spotify</span><span>Listen</span></a>
        <a class="service" href="https://music.apple.com/au/album/pilgrims-pace-single/6816145484" target="_blank" rel="noopener noreferrer"><span>Apple Music</span><span>Listen</span></a>
        <a class="service" href="https://music.youtube.com/watch?v=ROwIV9T7IIc&si=0AdnKWGgAymDhcqf" target="_blank" rel="noopener noreferrer"><span>YouTube Music</span><span>Listen</span></a>
        <a class="service" href="https://music.amazon.com.au/albums/B0HKZ3QZ2M?marketplaceId=A39IBJ37TRP1C6&musicTerritory=AU&ref=dm_sh_pVFmZyiynyFVsL5KDXfGFj46I" target="_blank" rel="noopener noreferrer"><span>Amazon Music</span><span>Listen</span></a>
        <a class="service" href="https://tidal.com/album/564211468/u" target="_blank" rel="noopener noreferrer"><span>TIDAL</span><span>Listen</span></a>
      </div>
    </div>
  </section>

  <section id="home" class="room" aria-label="Dubai apartment">
    <div class="room-name">Home</div>
    <div class="room-nav">
      <button class="arrow back" data-go="front" aria-label="Back to Downtown"></button>
      <button class="arrow next" data-go="drive" aria-label="Next room"></button>
    </div>
  </section>

  <nav class="dock" aria-label="Rooms">
    <button class="active" data-go="front">Downtown</button>
    <button data-go="drive">Drive</button>
    <button data-go="fountain">Fountain</button>
    <button data-go="studio">Studio</button>
    <button data-go="home">Home</button>
  </nav>
</div>

<script>
(() => {
  const ids = ['front','drive','fountain','studio','home'];
  const rooms = [...document.querySelectorAll('.room')];
  const controls = [...document.querySelectorAll('[data-go]')];

  function show(id){
    if(!ids.includes(id)) id = 'front';
    document.body.dataset.room = id;
    rooms.forEach(room => room.classList.toggle('active', room.id === id));
    document.querySelectorAll('.dock [data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === id));
    history.replaceState(null,'','#'+id);
  }

  controls.forEach(el => el.addEventListener('click', e => {
    e.preventDefault();
    show(el.dataset.go);
  }));

  const initial = location.hash.slice(1);
  show(ids.includes(initial) ? initial : 'front');

  // Preload room images so switching is immediate.
  [
    'https://images.pexels.com/photos/14749802/pexels-photo-14749802.jpeg?auto=compress&cs=tinysrgb&w=2400',
    'https://images.pexels.com/photos/30400180/pexels-photo-30400180.jpeg?auto=compress&cs=tinysrgb&w=2200',
    'https://images.pexels.com/photos/7586656/pexels-photo-7586656.jpeg?auto=compress&cs=tinysrgb&w=2200',
    'https://images.pexels.com/photos/32418264/pexels-photo-32418264.jpeg?auto=compress&cs=tinysrgb&w=2200'
  ].forEach(src => { const img = new Image(); img.src = src; });
})();
</script>
</body>
</html>
