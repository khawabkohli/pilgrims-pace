<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pilgrim's Pace</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }

    .cesium-widget-credits {
      display: block !important;
    }

    #backBtn {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.35);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    #roomPanel {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: min(360px, calc(100vw - 36px));
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(5,5,5,.78);
      backdrop-filter: blur(18px);
      color: white;
      z-index: 30;
      display: none;
    }

    #roomPanel img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 12px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .service {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: white;
      text-decoration: none;
      font-size: 12px;
    }

    .hotspot {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(0,0,0,.22);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 15;
      backdrop-filter: blur(5px);
    }

    .hotspot.gold {
      border-color: rgba(216,179,110,.95);
      color: #f3d7a3;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <button id="backBtn">←</button>

  <div id="roomPanel">
    <img src="YOUR_COVER_ART_URL_HERE" alt="Pilgrim's Pace cover" />
    <div class="services">
      <a class="service" href="https://open.spotify.com/track/7lAKKJmumRbe8TNYyafqcz?si=8Lk2luENT92Kbbb_65MvcQ&utm_source=copy-link" target="_blank">Spotify</a>
      <a class="service" href="https://music.apple.com/au/album/pilgrims-pace-single/6816145484" target="_blank">Apple</a>
      <a class="service" href="https://music.youtube.com/watch?v=ROwIV9T7IIc&si=0AdnKWGgAymDhcqf" target="_blank">YouTube</a>
      <a class="service" href="https://music.amazon.com.au/albums/B0HKZ3QZ2M?marketplaceId=A39IBJ37TRP1C6&musicTerritory=AU&ref=dm_sh_pVFmZyiynyFVsL5KDXfGFj46I" target="_blank">Amazon</a>
      <a class="service" href="https://tidal.com/album/564211468/u" target="_blank">TIDAL</a>
    </div>
  </div>

  <script type="module">
    Cesium.Ion.defaultAccessToken = "PASTE_YOUR_TOKEN_HERE";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      geocoder: false,
      baseLayerPicker: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
      fullscreenButton: false,
      shouldAnimate: true
    });

    viewer.scene.globe.show = false;
    viewer.scene.skyAtmosphere.show = true;
    viewer.scene.fog.enabled = true;
    viewer.scene.postProcessStages.fxaa.enabled = true;
    viewer.scene.highDynamicRange = true;

    const tileset = await Cesium.createGooglePhotorealistic3DTileset();
    viewer.scene.primitives.add(tileset);

    viewer.clock.currentTime = Cesium.JulianDate.now();

    // Dubai Downtown / Burj Khalifa start
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(55.2744, 25.1972, 1400),
      orientation: {
        heading: Cesium.Math.toRadians(25),
        pitch: Cesium.Math.toRadians(-38),
        roll: 0
      },
      duration: 2.5
    });

    // Hotspots
    const hotspots = [
      {
        name: "Drive",
        lon: 55.2708,
        lat: 25.1936,
        height: 35,
        room: "drive"
      },
      {
        name: "Fountain",
        lon: 55.2752,
        lat: 25.1955,
        height: 25,
        room: "fountain"
      },
      {
        name: "Work",
        lon: 55.2780,
        lat: 25.2003,
        height: 35,
        room: "work",
        gold: true
      },
      {
        name: "Production",
        lon: 55.2702,
        lat: 25.2004,
        height: 35,
        room: "production",
        gold: true
      }
    ];

    const container = document.body;
    const hotspotEls = [];
    const backBtn = document.getElementById("backBtn");
    const roomPanel = document.getElementById("roomPanel");

    hotspots.forEach(h => {
      const el = document.createElement("button");
      el.className = "hotspot" + (h.gold ? " gold" : "");
      el.textContent = "→";
      el.title = h.name;
      el.onclick = () => openRoom(h.room);
      container.appendChild(el);
      hotspotEls.push({
        el,
        position: Cesium.Cartesian3.fromDegrees(h.lon, h.lat, h.height),
        room: h.room
      });
    });

    function updateHotspots() {
      hotspotEls.forEach(h => {
        const canvasPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(
          viewer.scene,
          h.position
        );

        if (Cesium.defined(canvasPos)) {
          h.el.style.display = "grid";
          h.el.style.left = `${canvasPos.x - 24}px`;
          h.el.style.top = `${canvasPos.y - 24}px`;
        } else {
          h.el.style.display = "none";
        }
      });
    }

    viewer.scene.postRender.addEventListener(updateHotspots);

    let currentRoom = "downtown";

    function hideHotspots(hidden) {
      hotspotEls.forEach(h => {
        h.el.style.opacity = hidden ? "0" : "1";
        h.el.style.pointerEvents = hidden ? "none" : "auto";
      });
    }

    function openRoom(room) {
      currentRoom = room;
      backBtn.style.display = "block";

      if (room === "drive") {
        roomPanel.style.display = "none";
        hideHotspots(true);
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(55.2708, 25.1936, 250),
          orientation: {
            heading: Cesium.Math.toRadians(55),
            pitch: Cesium.Math.toRadians(-25),
            roll: 0
          },
          duration: 2
        });
      }

      if (room === "fountain") {
        roomPanel.style.display = "none";
        hideHotspots(true);
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(55.2752, 25.1955, 180),
          orientation: {
            heading: Cesium.Math.toRadians(10),
            pitch: Cesium.Math.toRadians(-30),
            roll: 0
          },
          duration: 2
        });
      }

      if (room === "work") {
        roomPanel.style.display = "block";
        hideHotspots(true);
        // Replace later with custom interior room overlay / canvas scene
      }

      if (room === "production") {
        roomPanel.style.display = "none";
        hideHotspots(true);
        // Replace later with production room interior
      }
    }

    backBtn.onclick = () => {
      currentRoom = "downtown";
      roomPanel.style.display = "none";
      hideHotspots(false);
      backBtn.style.display = "none";

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(55.2744, 25.1972, 1400),
        orientation: {
          heading: Cesium.Math.toRadians(25),
          pitch: Cesium.Math.toRadians(-38),
          roll: 0
        },
        duration: 2.2
      });
    };
  </script>
</body>
</html>
