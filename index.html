const views={

  downtown:{lon:55.26345,lat:25.18855,h:700,heading:49,pitch:-18},

    destination:Cesium.Cartesian3.fromDegrees(v.lon,v.lat,v.h),
    orientation:{
      heading:Cesium.Math.toRadians(v.heading),

}

/* Put the camera over Downtown BEFORE requesting the tiles.
   This avoids Cesium's default orbital view if Google tiles take a moment. */
setView(views.downtown);

let tileset;
try{
  tileset=await Cesium.createGooglePhotorealistic3DTileset();
  tileset.maximumScreenSpaceError=2.6;
  tileset.dynamicScreenSpaceError=false;
  tileset.cullRequestsWhileMoving=true;
  tileset.preloadWhenHidden=false;
  viewer.scene.primitives.add(tileset);

  // Turn the daylight photogrammetry into a moody night treatment.
  // This preserves the real textured geometry, while crushing daytime sand tones
  // and letting bright texture details read as practical/window light.
  const nightPass=new Cesium.PostProcessStage({
    name:"dubai-night-grade",
    fragmentShader:`
      uniform sampler2D colorTexture;
      in vec2 v_textureCoordinates;
      void main(){
        vec3 c=texture(colorTexture,v_textureCoordinates).rgb;
        float l=dot(c,vec3(0.2126,0.7152,0.0722));

        // Keep far more midtone detail so the photogrammetry still has depth.
        vec3 n=c*vec3(0.36,0.40,0.50);
        n=mix(n,vec3(l*0.20,l*0.23,l*0.31),0.18);

        // Bright photographic details become warm practical/city light.
        float lamp=smoothstep(0.62,0.94,l);
        n+=vec3(0.92,0.43,0.14)*lamp*0.34;

        // Cool shadow floor preserves façades and street depth.
        n+=vec3(0.018,0.025,0.043);
        n=pow(max(n,vec3(0.0)),vec3(0.92));
        out_FragColor=vec4(n,1.0);
      }`

  const bloom=viewer.scene.postProcessStages.bloom;
  bloom.enabled=true;
  bloom.uniforms.glowOnly=false;
  bloom.uniforms.contrast=118.0;
  bloom.uniforms.brightness=-0.34;
  bloom.uniforms.delta=0.85;
  bloom.uniforms.sigma=2.1;
  bloom.uniforms.stepSize=1.2;

  await tileset.readyPromise?.catch?.(()=>{});
  setView(views.downtown);
}catch(e){
  console.error("Google Photorealistic 3D Tiles failed:",e);
  const warning=document.createElement("div");
  warning.style.cssText="position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);max-width:520px;padding:16px 18px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.78);color:white;font:12px/1.55 Arial;text-align:center;backdrop-filter:blur(12px)";
  warning.textContent="Dubai 3D tiles could not load. Check that Google Photorealistic 3D Tiles are enabled for this Cesium ion account and that this token has geocode permission.";
  document.body.appendChild(warning);
}

const points=[
  {room:"drive",lon:55.2708,lat:25.1936,h:34},

  }

renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.shadowMap.enabled=true;

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,80);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.maxPolarAngle=Math.PI*.57;
scene.add(new THREE.HemisphereLight(0x91a7d5,0x160a04,.9));

const rim=new THREE.DirectionalLight(0x8baaff,1.8);rim.position.set(4,5,-4);scene.add(rim);

const M=(c,r=.58,m=.04)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,side:THREE.DoubleSide});
function box(parent,w,h,d,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function shell(g,type){
  const floor=M(type==="work"?0x2f241c:0x241d18,.64,.03);
  const plaster=M(type==="work"?0x1b1917:0x171616,.82,.01);
  const trim=M(0x0d0d0e,.34,.42);

  box(g,7.6,.10,6.4,M(0x0d0d0e,.92),0,3.18,0);

  // Back wall with a real architectural window opening.
  box(g,1.55,3.2,.12,plaster,-3.02,1.6,-3.2);
  box(g,1.55,3.2,.12,plaster,3.02,1.6,-3.2);

  // Front wall framing prevents the scene reading like props floating in a void.
  box(g,1.1,3.2,.12,plaster,-3.25,1.6,3.2);box(g,1.1,3.2,.12,plaster,3.25,1.6,3.2);

  // Recessed ceiling lights.
  [-2.5,0,2.5].forEach(x=>[-1.65,1.25].forEach(z=>{

}

function placeFit(url,parent,pos,targetMax,rot=[0,0,0],action=null){
  loader.load(url,g=>{
    const o=g.scene;
    const b0=new THREE.Box3().setFromObject(o),s0=new THREE.Vector3();b0.getSize(s0);
    const max=Math.max(s0.x,s0.y,s0.z)||1;
    o.scale.setScalar(targetMax/max);o.rotation.set(...rot);o.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(o),ctr=new THREE.Vector3();b.getCenter(ctr);
    o.position.set(pos[0]-ctr.x,pos[1]-b.min.y,pos[2]-ctr.z);
    o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;if(n.material){n.material.side=THREE.DoubleSide}if(action){n.userData.action=action;clickables.push(n)}}});
    parent.add(o);
  },undefined,()=>{});
}

const vinylNames=[["JAY-Z",0x1a2028],["SADE",0x50413e],["DRAKE",0x302014],["KANYE",0x6d421d]];
vinylNames.forEach((v,i)=>{
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#"+v[1].toString(16).padStart(6,"0");x.fillRect(0,0,256,256);x.fillStyle="#efe7d6";x.font="700 30px Arial";x.textAlign="center";x.fillText(v[0],128,139);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Mesh(new THREE.BoxGeometry(.44,.44,.025),new THREE.MeshStandardMaterial({map:tex,roughness:.62}));s.position.set(-.84+i*.57,1.82,-2.55);production.add(s);
});

new RGBELoader().load("https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/modern_buildings_night_1k.hdr",t=>{
  t.mapping=THREE.EquirectangularReflectionMapping;
  scene.environment=t;
  scene.background=t;
  scene.backgroundBlurriness=.12;
  scene.environmentIntensity=.78;
},undefined,()=>{});
function showInterior(room){
  work.visible=room==="work";production.visible=room==="production";
  controls.minDistance=2.0;controls.maxDistance=6.8;
  controls.minPolarAngle=.55;controls.maxPolarAngle=1.58;
  if(room==="work"){
    camera.position.set(3.75,1.90,4.15);
    controls.target.set(0,1.02,-.62);
  }else{
    camera.position.set(4.15,2.08,4.55);
    controls.target.set(.05,1.08,-.72);
  }
  controls.update();
}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=[0,0];
canvas.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
canvas.addEventListener("pointerup",e=>{
  if(document.body.dataset.room!=="work"||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;
  const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);
  const hit=ray.intersectObjects(clickables,true)[0];if(hit?.object?.userData?.action==="release")document.getElementById("release").classList.add("open");
});

const veil=document.getElementById("veil"),release=document.getElementById("release");
document.getElementById("closeRelease").onclick=()=>release.classList.remove("open");
let current="downtown";
async function transition(fn){veil.classList.add("on");await new Promise(r=>setTimeout(r,240));fn();requestAnimationFrame(()=>setTimeout(()=>veil.classList.remove("on"),80))}
async function openRoom(room){
  if(room===current)return;current=room;document.body.dataset.room=room;release.classList.remove("open");history.replaceState(null,"","#"+room);
  if(room==="work"||room==="production"){await transition(()=>{mapEl.style.display="none";grade.style.display="none";canvas.style.display="block";hideMarkers(true);showInterior(room)})}
  else{await transition(()=>{canvas.style.display="none";mapEl.style.display="block";grade.style.display="block";hideMarkers(room!=="downtown");if(room==="downtown")fly(views.downtown);if(room==="drive")fly(views.drive);if(room==="fountain")fly(views.fountain)})}
}
document.getElementById("back").onclick=()=>openRoom("downtown");
const hash=location.hash.slice(1);if(["drive","fountain","work","production"].includes(hash))setTimeout(()=>openRoom(hash),1200);
function loop(){requestAnimationFrame(loop);if(canvas.style.display!=="none"){controls.update();renderer.render(scene,camera)}}loop();
addEventListener("resize",()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();viewer.resize()});
setTimeout(()=>document.getElementById("loader").classList.add("hide"),2600);
</script>
</body>
</html>
