<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilgrim’s Pace — Khawab Kohli</title>
<meta name="description" content="Pilgrim’s Pace, a record by Khawab Kohli. Listen now.">
<meta property="og:title" content="Pilgrim’s Pace — Khawab Kohli">
<meta property="og:description" content="Listen now.">
<meta property="og:image" content="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg">
<meta name="theme-color" content="#17120b">
<style>
:root{
  --bg:#17120b;
  --text:#f2ead9;
  --muted:#c7b994;
  --faint:#9e9175;
  --rule:rgba(231,215,181,.18);
  --page-max:560px;
}
*{box-sizing:border-box}
html{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color-scheme:dark;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-width:280px;
  min-height:100vh;
  min-height:100svh;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background-color:var(--bg);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:url('https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg') center/cover no-repeat;
  transform:scale(1.04);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(180deg,rgba(23,18,11,.80),rgba(23,18,11,.96));
}
.page{
  width:100%;
  min-height:100vh;
  min-height:100svh;
  padding:
    max(18px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
}
main{
  width:min(100%,var(--page-max));
  margin:0 auto;
}
.cover{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  object-position:center;
  border:0;
  border-radius:1px;
  box-shadow:0 18px 60px rgba(0,0,0,.52);
}
.head{
  padding:clamp(18px,3.2vw,24px) 2px 17px;
  border-bottom:1px solid var(--rule);
}
.title{
  margin:0;
  max-width:100%;
  font-family:Georgia,'Times New Roman',serif;
  font-weight:400;
  font-size:clamp(34px,8vw,54px);
  line-height:.96;
  letter-spacing:-.04em;
  overflow-wrap:anywhere;
}
.artist{
  margin-top:10px;
  font-size:11px;
  line-height:1.35;
  letter-spacing:.23em;
  text-transform:uppercase;
  color:var(--muted);
}
.links a{
  min-height:60px;
  padding:0 2px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid var(--rule);
  font-size:15px;
  line-height:1.2;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .18s ease,transform .18s ease;
}
.links a span:first-child{
  min-width:0;
}
.links a span:last-child{
  flex:0 0 auto;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}
.links a:focus-visible{
  outline:2px solid var(--muted);
  outline-offset:4px;
}
.foot{
  padding:19px 2px 2px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:9px;
  line-height:1.45;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--faint);
}
@media (hover:hover) and (pointer:fine){
  .links a:hover{opacity:.65;transform:translateX(2px)}
}
@media (max-width:420px){
  .page{
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
  }
  .title{font-size:clamp(32px,10vw,42px)}
  .links a{min-height:58px}
  .foot{flex-direction:column;gap:5px}
}
@media (min-width:768px){
  .page{padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(36px,env(safe-area-inset-bottom))}
}
@media (min-width:1200px){
  .page{padding-top:42px;padding-bottom:42px}
}
@media (orientation:landscape) and (max-height:520px){
  .page{padding-top:14px;padding-bottom:18px}
  main{width:min(78vh,460px)}
}
@media (prefers-reduced-motion:reduce){
  .links a{transition:none}
}
</style>
</head>
<body>
<div class="page">
<main>
<img class="cover" src="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg" alt="Pilgrim’s Pace cover artwork">
<section class="head">
  <h1 class="title">Pilgrim’s Pace</h1>
  <div class="artist">Khawab Kohli</div>
</section>
<nav class="links" aria-label="Listen to Pilgrim’s Pace">
  <a href="https://open.spotify.com/track/7lAKKJmumRbe8TNYyafqcz" target="_blank" rel="noopener noreferrer"><span>Spotify</span><span>Listen ↗</span></a>
  <a href="https://music.apple.com/au/album/pilgrims-pace-single/6816145484" target="_blank" rel="noopener noreferrer"><span>Apple Music</span><span>Listen ↗</span></a>
  <a href="https://music.youtube.com/watch?v=ROwIV9T7IIc" target="_blank" rel="noopener noreferrer"><span>YouTube Music</span><span>Listen ↗</span></a>
  <a href="https://music.amazon.com.au/albums/B0HKZ3QZ2M" target="_blank" rel="noopener noreferrer"><span>Amazon Music</span><span>Listen ↗</span></a>
  <a href="https://tidal.com/album/564211468/u" target="_blank" rel="noopener noreferrer"><span>TIDAL</span><span>Listen ↗</span></a>
</nav>
<footer class="foot"><span>A record by Khawab Kohli</span><span>2026</span></footer>
</main>
</div>
</body>
</html>
