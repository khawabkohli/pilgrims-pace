<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilgrim's Pace</title>
<meta name="theme-color" content="#060606">
<meta name="description" content="Pilgrim's Pace by Khawab Kohli">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --fg:#f1ece2;
  --muted:rgba(241,236,226,.62);
  --line:rgba(255,255,255,.16);
  --glass:rgba(6,6,6,.80);
  --gold:#d4ae68;
  --safe-t:max(16px,env(safe-area-inset-top));
  --safe-r:max(16px,env(safe-area-inset-right));
  --safe-b:max(16px,env(safe-area-inset-bottom));
  --safe-l:max(16px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060606;color:var(--fg);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:#060606}
#cityMap{position:absolute;inset:0;z-index:0;width:100%;height:100%;background:#050608;opacity:0;pointer-events:none;transition:opacity .45s ease}
#world{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block;touch-action:none;transition:opacity .45s ease}
body.map-ready[data-view="city"] #cityMap,
body.map-ready[data-view="terrace"] #cityMap{opacity:1;pointer-events:auto}
body.map-ready[data-view="city"] #world,
body.map-ready[data-view="terrace"] #world{opacity:0;pointer-events:none}
body[data-view="work"] #cityMap,
body[data-view="production"] #cityMap{opacity:0;pointer-events:none}

#placeTag{
  position:absolute;z-index:18;left:var(--safe-l);top:var(--safe-t);
  display:none;padding:10px 12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.42);
  backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.28);
  pointer-events:none
}
body.map-ready[data-view="city"] #placeTag,
body.map-ready[data-view="terrace"] #placeTag{display:block}
#placeTag b{display:block;font:600 11px/1.15 Arial;letter-spacing:.16em;text-transform:uppercase;color:#f3eadc}
#placeTag span{display:block;margin-top:5px;font:9px/1.2 Arial;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,234,220,.55)}
#burjLabel{
  position:absolute;z-index:17;display:none;pointer-events:none;
  padding:5px 8px;border:1px solid rgba(212,174,104,.45);border-radius:999px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  color:#e4c58d;font:8px/1 Arial;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;transform:translate(-50%,-100%)
}
body.map-ready[data-view="city"] #burjLabel,
body.map-ready[data-view="terrace"] #burjLabel{display:block}

#releaseLaunch{
  position:absolute;z-index:31;right:var(--safe-r);bottom:var(--safe-b);display:none;
  border:1px solid rgba(212,174,104,.55);border-radius:999px;
  padding:11px 14px;background:rgba(8,8,8,.56);backdrop-filter:blur(12px);
  color:#efd39a;letter-spacing:.08em;text-transform:uppercase;font-size:9px;
  cursor:pointer;box-shadow:0 12px 36px rgba(0,0,0,.32)
}
body[data-view="work"] #releaseLaunch{display:block}
#vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:
radial-gradient(circle at 50% 42%,transparent 42%,rgba(0,0,0,.22) 76%,rgba(0,0,0,.50) 110%),
linear-gradient(180deg,rgba(0,0,0,.10),transparent 30%,rgba(0,0,0,.13))}
#fade{position:absolute;z-index:45;inset:0;background:#060606;opacity:0;pointer-events:none;transition:opacity .34s ease}
#fade.on{opacity:1}
#loader{position:absolute;z-index:70;inset:0;display:grid;place-items:center;background:#060606;transition:opacity .55s ease}
#loader.hide{opacity:0;pointer-events:none}
.track{width:min(230px,54vw);height:1px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{display:block;width:18%;height:100%;background:var(--gold);animation:loading 1.2s ease-in-out infinite alternate}
@keyframes loading{to{width:100%}}

.hotspot{
  position:absolute;z-index:22;width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(255,255,255,.74);background:rgba(4,4,4,.28);
  backdrop-filter:blur(7px);display:none;place-items:center;cursor:pointer;
  box-shadow:0 10px 34px rgba(0,0,0,.33);
  transition:transform .18s ease,opacity .22s ease,background .18s ease;
}
.hotspot::before{content:"→";font-size:24px;line-height:1;transform:translateY(-1px)}
.hotspot[data-label]::after{
  content:attr(data-label);position:absolute;left:50%;top:calc(100% + 9px);
  transform:translateX(-50%);padding:6px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.58);
  backdrop-filter:blur(9px);color:rgba(255,255,255,.86);
  font-size:9px;line-height:1;letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;pointer-events:none;text-shadow:0 1px 5px #000;
}
.hotspot.gold{border-color:rgba(220,181,108,.95);color:#f2d69d;box-shadow:0 10px 34px rgba(0,0,0,.33),0 0 28px rgba(212,174,104,.16)}
.hotspot:hover{transform:scale(1.07);background:rgba(4,4,4,.48)}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:4px}

#back{
  position:absolute;z-index:32;left:var(--safe-l);bottom:var(--safe-b);
  width:50px;height:50px;border-radius:50%;display:none;place-items:center;
  border:1px solid rgba(255,255,255,.42);background:rgba(4,4,4,.34);
  backdrop-filter:blur(12px);cursor:pointer;font-size:24px;
  box-shadow:0 12px 34px rgba(0,0,0,.26)
}
body:not([data-view="city"]) #back{display:grid}
#back[data-label]::after{
  content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 9px);
  transform:translateX(-50%);padding:6px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.58);
  backdrop-filter:blur(9px);color:rgba(255,255,255,.82);
  font-size:9px;line-height:1;letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;pointer-events:none;
}

#roomHint{
  position:absolute;z-index:24;left:50%;bottom:var(--safe-b);transform:translateX(-50%);
  display:none;padding:8px 11px;border:1px solid rgba(255,255,255,.12);
  border-radius:999px;background:rgba(0,0,0,.30);backdrop-filter:blur(10px);
  color:rgba(255,255,255,.58);font-size:8px;letter-spacing:.15em;text-transform:uppercase;
  pointer-events:none;white-space:nowrap
}
body[data-view="work"] #roomHint{display:block}

#release{
  position:absolute;z-index:36;right:clamp(14px,3vw,48px);top:50%;
  transform:translateY(-50%);display:none;width:min(370px,calc(100vw - 28px));
  padding:13px;border-radius:20px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(22px);
  box-shadow:0 25px 75px rgba(0,0,0,.56)
}
#release.open{display:block}
#release img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;margin-bottom:12px;box-shadow:0 16px 42px rgba(0,0,0,.42)}
#release .close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);cursor:pointer;font-size:19px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.service{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid rgba(255,255,255,.13);border-radius:12px;text-decoration:none;background:rgba(255,255,255,.026);font-size:12px}
.service span:last-child{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.service:hover{background:rgba(255,255,255,.07)}

@media(max-width:780px){
  .hotspot{width:44px;height:44px}
  #release{left:12px;right:12px;top:auto;bottom:78px;transform:none;width:auto;max-height:74vh;overflow:auto}
  .services{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){#fade,#loader,.hotspot{transition:none}}
</style>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
</head>
<body data-view="city">
<div id="app">
  <div id="cityMap" aria-label="Interactive 3D map of Downtown Dubai"></div>
  <canvas id="world"></canvas>
  <div id="placeTag"><b>Downtown Dubai</b><span>Burj Khalifa · Dubai Fountain</span></div>
  <div id="burjLabel">Burj Khalifa</div>
  <div id="vignette"></div>
  <div id="fade"></div>

  <button id="workHotspot" class="hotspot gold" data-label="Work Room" aria-label="Enter work room"></button>
  <button id="productionHotspot" class="hotspot gold" data-label="Studio" aria-label="Enter production room"></button>

<script>
window.__bootError=false;
window.addEventListener('error',function(e){
  window.__bootError=true;
  const l=document.getElementById('loader');
  if(l) l.innerHTML='<div style="max-width:520px;padding:22px;color:#eee;font:12px/1.55 Arial;text-align:center">3D scene error: '+String(e.message||'unknown error')+'</div>';
});
window.addEventListener('unhandledrejection',function(e){
  window.__bootError=true;
  const l=document.getElementById('loader');
  if(l) l.innerHTML='<div style="max-width:520px;padding:22px;color:#eee;font:12px/1.55 Arial;text-align:center">3D asset error: '+String((e.reason&&e.reason.message)||e.reason||'unknown error')+'</div>';
});
setTimeout(function(){
  if(!window.__bootError){
    const l=document.getElementById('loader');
    if(l) l.classList.add('hide');
  }
},1800);

if(typeof THREE==='undefined'){
  throw new Error('Three.js failed to load');
}

let dubaiMap=null;
let mapReady=false;
const DUBAI_HOME={center:[55.27515,25.19655],zoom:16.05,pitch:68,bearing:-24};
const DUBAI_WATER={center:[55.27545,25.19525],zoom:17.25,pitch:72,bearing:24};
const DUBAI_POINTS={
  work:[55.27910,25.19755],
  production:[55.27195,25.19415],
  waterfront:[55.27545,25.19535],
  burj:[55.27435,25.19720]
};

function initDubaiMap(){
  if(typeof maplibregl==='undefined') return;
  try{
    dubaiMap=new maplibregl.Map({
      container:'cityMap',
      style:{
        version:8,
        sources:{
          satellite:{
            type:'raster',
            tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize:256,
            attribution:'Imagery © Esri'
          },
          openfreemap:{type:'vector',url:'https://tiles.openfreemap.org/planet'}
        },
        layers:[
          {
            id:'satellite',
            type:'raster',
            source:'satellite',
            paint:{
              'raster-saturation':-.16,
              'raster-contrast':.12,
              'raster-brightness-min':.03,
              'raster-brightness-max':.72
            }
          }
        ]
      },
      center:DUBAI_HOME.center,
      zoom:DUBAI_HOME.zoom,
      pitch:DUBAI_HOME.pitch,
      bearing:DUBAI_HOME.bearing,
      maxPitch:80,
      minZoom:14.4,
      maxZoom:19,
      attributionControl:false,
      canvasContextAttributes:{antialias:true}
    });

    dubaiMap.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');

    dubaiMap.on('load',()=>{
      try{
        dubaiMap.addLayer({
          id:'dubai-water',
          type:'fill',
          source:'openfreemap',
          'source-layer':'water',
          paint:{
            'fill-color':'#07151d',
            'fill-opacity':.33
          }
        });

        dubaiMap.addLayer({
          id:'dubai-3d-buildings',
          type:'fill-extrusion',
          source:'openfreemap',
          'source-layer':'building',
          minzoom:14,
          filter:['!=',['get','hide_3d'],true],
          paint:{
            'fill-extrusion-color':[
              'interpolate',['linear'],
              ['coalesce',['to-number',['get','render_height']],0],
              0,'#17191c',
              60,'#22262b',
              180,'#3c3934',
              350,'#6a5943',
              700,'#a77d49'
            ],
            'fill-extrusion-height':[
              'interpolate',['linear'],['zoom'],
              14.6,0,
              15.1,['coalesce',['to-number',['get','render_height']],0]
            ],
            'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],
            'fill-extrusion-opacity':.92
          }
        });
      }catch(e){ console.warn('Map detail layer warning',e); }

      mapReady=true;
      document.body.classList.add('map-ready');
      city.visible=false;
      dubaiMap.resize();
      updateMapUI();
    });

    dubaiMap.on('move',updateMapUI);
    dubaiMap.on('zoom',updateMapUI);
    dubaiMap.on('rotate',updateMapUI);
  }catch(e){
    console.warn('Dubai map fallback active',e);
  }
}

function positionMapElement(el,lngLat,offsetY=0){
  if(!mapReady||!dubaiMap){el.style.display='none';return}
  const p=dubaiMap.project(lngLat);
  if(p.x<-90||p.x>innerWidth+90||p.y<-90||p.y>innerHeight+90){el.style.display='none';return}
  el.style.display='grid';
  el.style.left=(p.x-el.offsetWidth/2)+'px';
  el.style.top=(p.y-el.offsetHeight/2+offsetY)+'px';
}

function updateMapUI(){
  if(!mapReady||!dubaiMap) return;
  const cityMain=document.body.dataset.view==='city';
  positionMapElement(document.getElementById('workHotspot'),DUBAI_POINTS.work);
  positionMapElement(document.getElementById('productionHotspot'),DUBAI_POINTS.production);
  positionMapElement(document.getElementById('terraceHotspot'),DUBAI_POINTS.waterfront);
  if(!cityMain){
    document.getElementById('workHotspot').style.display='none';
    document.getElementById('productionHotspot').style.display='none';
    document.getElementById('terraceHotspot').style.display='none';
  }
  const b=dubaiMap.project(DUBAI_POINTS.burj);
  const lab=document.getElementById('burjLabel');
  lab.style.left=b.x+'px';lab.style.top=(b.y-12)+'px';
}

initDubaiMap();

const canvas=document.getElementById('world');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const pixelCap=matchMedia('(max-width:900px)').matches?1.08:1.30;
renderer.setPixelRatio(Math.min(devicePixelRatio,pixelCap));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030508);
scene.fog=new THREE.FogExp2(0x05070a,.0125);

const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.04,180);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.enablePan=false;
controls.maxPolarAngle=Math.PI*.49;
controls.minPolarAngle=Math.PI*.16;

const ambient=new THREE.HemisphereLight(0x6c7fa4,0x0b0705,.34);
scene.add(ambient);
const moon=new THREE.DirectionalLight(0x8ea8df,.88);
moon.position.set(18,32,18);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-35;moon.shadow.camera.right=35;moon.shadow.camera.top=35;moon.shadow.camera.bottom=-35;
scene.add(moon);

const city=new THREE.Group();
const work=new THREE.Group();
const production=new THREE.Group();
scene.add(city,work,production);
work.visible=false;production.visible=false;

const MAT={
  asphalt:new THREE.MeshStandardMaterial({color:0x090a0b,roughness:.94,metalness:.02}),
  concrete:new THREE.MeshStandardMaterial({color:0x1a1a19,roughness:.76,metalness:.05}),
  concrete2:new THREE.MeshStandardMaterial({color:0x0e1115,roughness:.86,metalness:.03}),
  metal:new THREE.MeshStandardMaterial({color:0x16181c,roughness:.31,metalness:.62}),
  wood:new THREE.MeshStandardMaterial({color:0x3a271b,roughness:.58,metalness:.03}),
  dark:new THREE.MeshStandardMaterial({color:0x111214,roughness:.56,metalness:.19}),
  wall:new THREE.MeshStandardMaterial({color:0x181715,roughness:.86,metalness:.01,side:THREE.DoubleSide}),
  rug:new THREE.MeshStandardMaterial({color:0x302b27,roughness:.96}),
  gold:new THREE.MeshStandardMaterial({color:0xc59a56,roughness:.28,metalness:.74}),
  water:new THREE.MeshPhysicalMaterial({color:0x061018,roughness:.10,metalness:.62,clearcoat:1,clearcoatRoughness:.08,transparent:true,opacity:.98}),
  walnut:new THREE.MeshStandardMaterial({color:0x2c1a11,roughness:.50,metalness:.04}),
  darkWalnut:new THREE.MeshStandardMaterial({color:0x1d120d,roughness:.58,metalness:.03}),
  aluminum:new THREE.MeshStandardMaterial({color:0x9fa5ad,roughness:.27,metalness:.92}),
  blackGlass:new THREE.MeshStandardMaterial({color:0x090b0f,roughness:.14,metalness:.30}),
  leather:new THREE.MeshStandardMaterial({color:0x151515,roughness:.87,metalness:.03}),
  fabric:new THREE.MeshStandardMaterial({color:0x24201e,roughness:.96,metalness:.01}),
  brass:new THREE.MeshStandardMaterial({color:0xb58a4b,roughness:.34,metalness:.78})
};

// lightweight procedural PBR detail: no extra network downloads, no texture-loading roulette
function seededNoise(seed){
  let s=seed>>>0;
  return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
}
function makeSurfaceTexture(kind,seed=1,size=512){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d'),rnd=seededNoise(seed);
  if(kind==='wood'){
    x.fillStyle='#3a2417';x.fillRect(0,0,size,size);
    for(let p=0;p<6;p++){
      const y=p*size/6;
      x.fillStyle=p%2?'#42291a':'#352116';x.fillRect(0,y,size,size/6);
      x.fillStyle='rgba(10,5,2,.55)';x.fillRect(0,y,2,size/6);
      for(let i=0;i<24;i++){
        const yy=y+rnd()*size/6;
        x.strokeStyle='rgba(255,215,165,'+(0.015+rnd()*.035)+')';
        x.lineWidth=.6+rnd()*1.1;x.beginPath();
        x.moveTo(0,yy);
        const bend=(rnd()-.5)*18;
        x.bezierCurveTo(size*.28,yy+bend,size*.72,yy-bend,size,yy+(rnd()-.5)*8);
        x.stroke();
      }
    }
  }else if(kind==='plaster'){
    x.fillStyle='#262321';x.fillRect(0,0,size,size);
    for(let i=0;i<5200;i++){
      const v=110+Math.floor(rnd()*70);
      x.fillStyle='rgba('+v+','+(v-4)+','+(v-8)+','+(0.008+rnd()*.018)+')';
      const r=.3+rnd()*1.4;x.fillRect(rnd()*size,rnd()*size,r,r);
    }
  }else if(kind==='fabric'){
    x.fillStyle='#262220';x.fillRect(0,0,size,size);
    x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=1;
    for(let i=0;i<size;i+=4){x.beginPath();x.moveTo(i,0);x.lineTo(i,size);x.stroke();}
    x.strokeStyle='rgba(0,0,0,.12)';
    for(let i=0;i<size;i+=5){x.beginPath();x.moveTo(0,i);x.lineTo(size,i);x.stroke();}
  }else if(kind==='asphalt'){
    x.fillStyle='#111214';x.fillRect(0,0,size,size);
    for(let i=0;i<7000;i++){
      const v=80+Math.floor(rnd()*80);
      x.fillStyle='rgba('+v+','+v+','+v+','+(0.015+rnd()*.025)+')';

const windowTextures=[];
function windowTexture(seed=1){
  if(windowTextures[seed]) return windowTextures[seed];
  const c=document.createElement('canvas');c.width=256;c.height=512;const x=c.getContext('2d');
  x.fillStyle='#121417';x.fillRect(0,0,c.width,c.height);
  let s=seed*92821+17;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  const cols=8,rows=20,padX=9,padY=8;
  const cw=(256-padX*2)/cols,ch=(512-padY*2)/rows;
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
    const on=rnd()>.45;
    x.fillStyle=on?(rnd()>.8?'#d7e6ff':'#c98746'):'#171819';
    x.globalAlpha=on?(.48+rnd()*.42):.55;
    x.fillRect(padX+q*cw+3,padY+r*ch+4,cw-7,ch-9);
  }
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(1.1,1.2);
  windowTextures[seed]=t;
  return t;
}

}

}

function fitModel(obj,targetMax,pos,matOverride=null){
  const b0=new THREE.Box3().setFromObject(obj),sz=new THREE.Vector3();b0.getSize(sz);

    if(n.isMesh){
      n.castShadow=true;n.receiveShadow=true;
      if(matOverride)n.material=matOverride.clone();
      else if(n.material){n.material.roughness=Math.min(n.material.roughness??.6,.55);n.material.metalness=Math.max(n.material.metalness||0,.18)}
    }
  });
}

function normalizeAsset(root,scale=1){
  root.scale.setScalar(scale);
  root.updateMatrixWorld(true);
  const b=new THREE.Box3().setFromObject(root);
  const ctr=new THREE.Vector3();b.getCenter(ctr);
  root.position.x-=ctr.x;
  root.position.z-=ctr.z;
  root.position.y-=b.min.y;
  root.traverse(n=>{
    if(n.isMesh){
      n.castShadow=true;
      n.receiveShadow=true;
      if(n.material){
        n.material.envMapIntensity=.72;
        n.material.needsUpdate=true;
      }
    }
  });
  return root;
}

async function transition(fn){
  fade.classList.add('on');await new Promise(r=>setTimeout(r,250));fn();
  requestAnimationFrame(()=>setTimeout(()=>fade.classList.remove('on'),80));
}
async function openView(name){
  if(name===current)return;
  current=name;document.body.dataset.view=name;release.classList.remove('open');
  history.replaceState(null,'','#'+name);
  await transition(()=>{
    const exterior=(name==='city'||name==='terrace');
    city.visible=(!mapReady&&exterior);
    work.visible=(name==='work');
    production.visible=(name==='production');

    if(exterior&&mapReady&&dubaiMap){
      dubaiMap.resize();
      dubaiMap.flyTo(name==='terrace'?{
        center:DUBAI_WATER.center,zoom:DUBAI_WATER.zoom,pitch:DUBAI_WATER.pitch,bearing:DUBAI_WATER.bearing,duration:1050
      }:{
        center:DUBAI_HOME.center,zoom:DUBAI_HOME.zoom,pitch:DUBAI_HOME.pitch,bearing:DUBAI_HOME.bearing,duration:1050
      });
      updateMapUI();
    }else{
      setCamera(name);
    }
  });
}
hsWork.onclick=()=>openView('work');
hsProd.onclick=()=>openView('production');
hsTerrace.onclick=()=>openView('terrace');
back.onclick=()=>openView('city');
document.getElementById('closeRelease').onclick=()=>release.classList.remove('open');
document.getElementById('releaseLaunch').onclick=()=>release.classList.add('open');

/* ---------- INTERACTIONS ---------- */
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=[0,0];
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{
  if(current!=='work'||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;
  const r=canvas.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObject(laptopHit,true)[0];
  if(hit)release.classList.add('open');
});

const temp=new THREE.Vector3();
function placeHotspot(el,pos,visible=true){
  if(!visible){el.style.display='none';return}
  temp.copy(pos).project(camera);
  const inFront=temp.z<1&&temp.z>-1;
  if(!inFront){el.style.display='none';return}
  const x=(temp.x*.5+.5)*innerWidth,y=(-temp.y*.5+.5)*innerHeight;
  if(x<-80||x>innerWidth+80||y<-80||y>innerHeight+80){el.style.display='none';return}
  el.style.display='grid';el.style.left=(x-el.offsetWidth/2)+'px';el.style.top=(y-el.offsetHeight/2)+'px';
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  try{
    const t=clock.getElapsedTime();
    if(city.visible){
      cars.forEach(c=>{
        c.t=(c.t+c.speed*.016*60)%1;
        const p=carPath.getPointAt(c.t),p2=carPath.getPointAt((c.t+.008)%1);
        if(p&&p2){c.g.position.copy(p);c.g.lookAt(p2);}
      });
      lake.material.clearcoatRoughness=.14+Math.sin(t*.65)*.025;
    }
    controls.update();
    renderer.render(scene,camera);

    const cityMain=current==='city';
    if(mapReady&&dubaiMap){
      if(cityMain) updateMapUI();
    }else{
      placeHotspot(hsWork,anchorWork,cityMain);
      placeHotspot(hsProd,anchorProd,cityMain);
      placeHotspot(hsTerrace,anchorTerrace,cityMain);
    }
  }catch(err){
    console.error('render loop error',err);
  }
}

animate();

addEventListener('resize',()=>{
  renderer.setPixelRatio(Math.min(devicePixelRatio,pixelCap));
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(dubaiMap) dubaiMap.resize();
});

const initial=location.hash.slice(1);
if(['terrace','work','production'].includes(initial)){
  setTimeout(()=>openView(initial),450);
}
</script>
