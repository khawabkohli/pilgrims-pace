<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilgrim's Pace</title>
<meta name="theme-color" content="#080705">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.css">
<style>
:root{
  --fg:#f4eee3;
  --muted:rgba(244,238,227,.66);
  --line:rgba(255,255,255,.17);
  --glass:rgba(8,7,5,.72);
  --safe-t:max(16px,env(safe-area-inset-top));
  --safe-r:max(16px,env(safe-area-inset-right));
  --safe-b:max(16px,env(safe-area-inset-bottom));
  --safe-l:max(16px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080705;color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button,a{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:#080705}
#map,#interior{position:absolute;inset:0}
#map{z-index:1}
#interior{z-index:2;display:none;width:100%;height:100%}
#veil{position:absolute;inset:0;z-index:40;background:#080705;opacity:0;pointer-events:none;transition:opacity .34s ease}
#veil.on{opacity:1}

.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}
.maplibregl-canvas{filter:saturate(.82) contrast(1.06)}

.hotspot{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.72);
  background:rgba(6,5,4,.2);backdrop-filter:blur(5px);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 28px rgba(0,0,0,.24);
  transition:transform .18s ease,opacity .3s ease,background .18s ease;
}
.hotspot::before{content:"→";font-size:24px;line-height:1;transform:translateY(-1px)}
.hotspot:hover{transform:scale(1.06);background:rgba(7,6,4,.44)}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:4px}
.hotspot.gold{border-color:rgba(226,184,105,.95);color:#f2d49b}

#back{
  position:absolute;z-index:30;left:var(--safe-l);bottom:var(--safe-b);
  width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(255,255,255,.42);background:rgba(7,6,5,.28);
  backdrop-filter:blur(10px);display:none;place-items:center;cursor:pointer;
  font-size:24px
}
body:not([data-room="downtown"]) #back{display:grid}

#release{
  position:absolute;z-index:32;right:clamp(14px,3vw,48px);top:50%;
  transform:translateY(-50%);display:none;
  width:min(365px,calc(100vw - 28px));padding:13px;border-radius:20px;
  border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(22px);box-shadow:0 25px 72px rgba(0,0,0,.48)
}
body[data-room="studio"] #release{display:block}
#release img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;margin-bottom:12px;box-shadow:0 16px 42px rgba(0,0,0,.4)}
.services{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.service{
  min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 12px;border:1px solid rgba(255,255,255,.13);border-radius:12px;
  text-decoration:none;background:rgba(255,255,255,.025);font-size:12px
}
.service span:last-child{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.service:hover{background:rgba(255,255,255,.07)}

#load{
  position:absolute;z-index:60;inset:0;background:#080705;display:grid;place-items:center;
  transition:opacity .45s ease
}
#load.hide{opacity:0;pointer-events:none}
#loadTrack{width:min(220px,54vw);height:1px;background:rgba(255,255,255,.14);overflow:hidden}
#loadBar{height:100%;width:0;background:#d8b06b;transition:width .3s ease}

#roomDot{
  position:absolute;z-index:25;right:var(--safe-r);top:var(--safe-t);
  display:none;width:8px;height:8px;border-radius:50%;background:#d8b06b;
  box-shadow:0 0 18px rgba(216,176,107,.66)
}
body:not([data-room="downtown"]) #roomDot{display:block}

@media(max-width:780px){
  #release{left:12px;right:12px;top:auto;bottom:78px;transform:none;width:auto;max-height:73vh;overflow:auto}
  .services{grid-template-columns:1fr}
  .hotspot{width:44px;height:44px}
}
@media(prefers-reduced-motion:reduce){#veil,#load,.hotspot{transition:none}}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
  }
}
</script>
</head>
<body data-room="downtown">
<div id="app">
  <div id="map"></div>
  <canvas id="interior"></canvas>
  <div id="veil"></div>
  <div id="roomDot"></div>
  <button id="back" aria-label="Back">←</button>

  <section id="release" aria-label="Listen">
    <img src="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg" alt="Pilgrim's Pace cover artwork">
    <div class="services">
      <a class="service" href="https://open.spotify.com/track/7lAKKJmumRbe8TNYyafqcz?si=8Lk2luENT92Kbbb_65MvcQ&utm_source=copy-link" target="_blank" rel="noopener noreferrer"><span>Spotify</span><span>Listen</span></a>
      <a class="service" href="https://music.apple.com/au/album/pilgrims-pace-single/6816145484" target="_blank" rel="noopener noreferrer"><span>Apple Music</span><span>Listen</span></a>
      <a class="service" href="https://music.youtube.com/watch?v=ROwIV9T7IIc&si=0AdnKWGgAymDhcqf" target="_blank" rel="noopener noreferrer"><span>YouTube Music</span><span>Listen</span></a>
      <a class="service" href="https://music.amazon.com.au/albums/B0HKZ3QZ2M?marketplaceId=A39IBJ37TRP1C6&musicTerritory=AU&ref=dm_sh_pVFmZyiynyFVsL5KDXfGFj46I" target="_blank" rel="noopener noreferrer"><span>Amazon Music</span><span>Listen</span></a>
      <a class="service" href="https://tidal.com/album/564211468/u" target="_blank" rel="noopener noreferrer"><span>TIDAL</span><span>Listen</span></a>
    </div>
  </section>

  <div id="load"><div id="loadTrack"><div id="loadBar"></div></div></div>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.mjs';
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';

const mapEl=document.getElementById('map');
const interiorCanvas=document.getElementById('interior');
const veil=document.getElementById('veil');
const back=document.getElementById('back');
const load=document.getElementById('load');
const loadBar=document.getElementById('loadBar');

const downtown=[55.27455,25.19715];
const views={
  downtown:{center:downtown,zoom:15.65,pitch:72,bearing:-32},
  drive:{center:[55.27085,25.19355],zoom:17.25,pitch:77,bearing:38},
  fountain:{center:[55.27515,25.19545],zoom:17.65,pitch:75,bearing:-10}
};

const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:views.downtown.center,
  zoom:views.downtown.zoom,
  pitch:views.downtown.pitch,
  bearing:views.downtown.bearing,
  maxPitch:85,
  minZoom:14.5,
  maxZoom:19.5,
  maxBounds:[[55.255,25.184],[55.292,25.212]],
  attributionControl:false,
  canvasContextAttributes:{antialias:true}
});

let modelScaleCorrection=1;
const burjOrigin=[55.274376,25.197197];
const burjMerc=maplibregl.MercatorCoordinate.fromLngLat(burjOrigin,0);
const modelTransform={
  translateX:burjMerc.x,translateY:burjMerc.y,translateZ:burjMerc.z,
  rotateX:Math.PI/2,rotateY:0,rotateZ:0,
  scale:burjMerc.meterInMercatorCoordinateUnits()
};

const burjLayer={
  id:'burj-khalifa-model',type:'custom',renderingMode:'3d',
  onAdd(map,gl){
    this.camera=new THREE.Camera();
    this.scene=new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xe8efff,0x2a1406,2.0));
    const key=new THREE.DirectionalLight(0xffd0a0,4.4);key.position.set(-20,-40,80);this.scene.add(key);
    const rim=new THREE.DirectionalLight(0xaec9ff,2.7);rim.position.set(40,20,60);this.scene.add(rim);
    new GLTFLoader().load(
      'https://cdn.jsdelivr.net/gh/hszzhua2/world-architecture-atlas-3d@clean-main/apps/geolibre-desktop/public/models/burj-khalifa.glb',
      gltf=>{
        const obj=gltf.scene;
        const box=new THREE.Box3().setFromObject(obj);
        const h=Math.max(.001,box.max.y-box.min.y);
        modelScaleCorrection=828/h;
        obj.scale.setScalar(modelScaleCorrection);
        const box2=new THREE.Box3().setFromObject(obj);
        obj.position.y-=box2.min.y;
        obj.traverse(n=>{
          if(n.isMesh&&n.material){
            n.material.metalness=Math.max(n.material.metalness||0,.18);
            n.material.roughness=Math.min(n.material.roughness??.7,.48);
          }
        });
        this.scene.add(obj);
        map.triggerRepaint();
      }
    );
    this.map=map;
    this.renderer=new THREE.WebGLRenderer({canvas:map.getCanvas(),context:gl,antialias:true});
    this.renderer.autoClear=false;
  },
  render(gl,args){
    const rx=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),modelTransform.rotateX);
    const ry=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0,1,0),modelTransform.rotateY);
    const rz=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0,0,1),modelTransform.rotateZ);
    const m=new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);
    const l=new THREE.Matrix4()
      .makeTranslation(modelTransform.translateX,modelTransform.translateY,modelTransform.translateZ)
      .scale(new THREE.Vector3(modelTransform.scale,-modelTransform.scale,modelTransform.scale))
      .multiply(rx).multiply(ry).multiply(rz);
    this.camera.projectionMatrix=m.multiply(l);
    this.renderer.resetState();
    this.renderer.render(this.scene,this.camera);
    this.map.triggerRepaint();
  }
};

const markerDefs=[
  {room:'drive',coord:[55.2706,25.1937]},
  {room:'fountain',coord:[55.2750,25.1956]},
  {room:'studio',coord:[55.2780,25.2003]},
  {room:'home',coord:[55.2702,25.2004]}
];
const markers=[];

function makeMarker(def){
  const el=document.createElement('button');
  el.className='hotspot'+((def.room==='studio'||def.room==='home')?' gold':'');
  el.setAttribute('aria-label','Open '+def.room);
  el.addEventListener('click',e=>{e.stopPropagation();openRoom(def.room)});
  const m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(def.coord).addTo(map);
  markers.push({m,el,room:def.room});
}

map.on('load',()=>{
  // Strip the map back to architecture and roads. No labels, no tourist-map clutter.
  for(const layer of map.getStyle().layers){
    try{
      if(layer.type==='symbol') map.setLayoutProperty(layer.id,'visibility','none');
      if(layer.type==='background') map.setPaintProperty(layer.id,'background-color','#080705');
      if(layer.type==='line'){
        map.setPaintProperty(layer.id,'line-color','#463728');
        map.setPaintProperty(layer.id,'line-opacity',.72);
      }
      if(layer.type==='fill'){
        const water=(layer['source-layer']||'').toLowerCase().includes('water')||layer.id.toLowerCase().includes('water');
        map.setPaintProperty(layer.id,'fill-color',water?'#0b1517':'#17130f');
        map.setPaintProperty(layer.id,'fill-opacity',water?.92:.86);
      }
    }catch(e){}
  }

  if(!map.getSource('openfreemap')){
    map.addSource('openfreemap',{url:'https://tiles.openfreemap.org/planet',type:'vector'});
  }
  const firstSymbol=map.getStyle().layers.find(l=>l.type==='symbol')?.id;
  map.addLayer({
    id:'3d-buildings',
    source:'openfreemap',
    'source-layer':'building',
    type:'fill-extrusion',
    minzoom:14.5,
    filter:['!=',['get','hide_3d'],true],
    paint:{
      'fill-extrusion-color':[
        'interpolate',['linear'],['coalesce',['get','render_height'],0],
        0,'#1c1712',60,'#2c241c',180,'#3b3228',350,'#5b5147',700,'#857b70'
      ],
      'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
      'fill-extrusion-opacity':.94,
      'fill-extrusion-vertical-gradient':true
    }
  },firstSymbol);

  try{map.setLight({anchor:'map',color:'#ffd2a0',intensity:.52,position:[1.15,210,38]});}catch(e){}
  map.addLayer(burjLayer);
  markerDefs.forEach(makeMarker);
  setTimeout(()=>load.classList.add('hide'),800);
});

map.on('error',e=>console.warn('map',e?.error||e));

/* Interior worlds */
const irenderer=new THREE.WebGLRenderer({canvas:interiorCanvas,antialias:true});
irenderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
irenderer.setSize(innerWidth,innerHeight,false);
irenderer.outputColorSpace=THREE.SRGBColorSpace;
irenderer.toneMapping=THREE.ACESFilmicToneMapping;
irenderer.toneMappingExposure=1.08;
irenderer.shadowMap.enabled=true;
irenderer.shadowMap.type=THREE.PCFSoftShadowMap;

const iscene=new THREE.Scene();
iscene.background=new THREE.Color(0x080705);
const icamera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.05,100);
const icontrols=new OrbitControls(icamera,interiorCanvas);
icontrols.enableDamping=true;icontrols.enablePan=false;icontrols.maxPolarAngle=Math.PI*.54;
iscene.add(new THREE.HemisphereLight(0xe8edff,0x1b0d04,1.8));
const iKey=new THREE.SpotLight(0xffbb72,75,30,Math.PI*.42,.6,1.3);
iKey.position.set(2,7,4);iKey.castShadow=true;iscene.add(iKey);
const iFill=new THREE.DirectionalLight(0x9ebaff,2.2);iFill.position.set(-6,5,-4);iscene.add(iFill);

const studioGroup=new THREE.Group(),homeGroup=new THREE.Group();
iscene.add(studioGroup,homeGroup);
studioGroup.visible=false;homeGroup.visible=false;

const gltfLoader=new GLTFLoader();
const assets={
  studio:'https://cdn.3dassets.dev/assets/33834/v1/model.glb',
  home:'https://cdn.3dassets.dev/assets/29882/v1/model.glb'
};
const ready={studio:false,home:false};

function centerModel(obj){
  const box=new THREE.Box3().setFromObject(obj);
  const c=new THREE.Vector3();box.getCenter(c);
  obj.position.x-=c.x;obj.position.z-=c.z;obj.position.y-=box.min.y;
  obj.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
}

Promise.all([
  gltfLoader.loadAsync(assets.studio).then(g=>{centerModel(g.scene);studioGroup.add(g.scene);ready.studio=true}),
  gltfLoader.loadAsync(assets.home).then(g=>{centerModel(g.scene);homeGroup.add(g.scene);ready.home=true})
]).catch(console.warn);

new RGBELoader().load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/modern_buildings_night_1k.hdr',
  tex=>{
    tex.mapping=THREE.EquirectangularReflectionMapping;
    iscene.environment=tex;
  },
  undefined,
  ()=>{}
);

let current='downtown';
function hideMarkers(hide){markers.forEach(x=>{x.el.style.opacity=hide?'0':'1';x.el.style.pointerEvents=hide?'none':'auto'})}
function mapView(room){
  const v=views[room];if(!v)return;
  map.flyTo({center:v.center,zoom:v.zoom,pitch:v.pitch,bearing:v.bearing,duration:1700,essential:true});
}
function setInterior(room){
  studioGroup.visible=room==='studio';
  homeGroup.visible=room==='home';
  if(room==='studio'){
    icamera.position.set(7.1,3.2,7.0);icontrols.target.set(0,1.15,0);
    icontrols.minDistance=3.8;icontrols.maxDistance=12;
  }else{
    icamera.position.set(8.2,5.8,8.4);icontrols.target.set(0,1.05,0);
    icontrols.minDistance=4.8;icontrols.maxDistance=14;
  }
  icontrols.update();
}

async function transition(fn){
  veil.classList.add('on');
  await new Promise(r=>setTimeout(r,280));
  fn();
  requestAnimationFrame(()=>setTimeout(()=>veil.classList.remove('on'),90));
}
async function openRoom(room){
  if(room===current)return;
  current=room;document.body.dataset.room=room;history.replaceState(null,'','#'+room);
  if(room==='studio'||room==='home'){
    await transition(()=>{
      mapEl.style.display='none';
      interiorCanvas.style.display='block';
      setInterior(room);
      hideMarkers(true);
    });
  }else{
    await transition(()=>{
      interiorCanvas.style.display='none';
      mapEl.style.display='block';
      hideMarkers(room!=='downtown');
      map.resize();
      mapView(room);
    });
  }
}
back.addEventListener('click',()=>openRoom('downtown'));

const hash=location.hash.slice(1);
map.once('idle',()=>{if(hash&&hash!=='downtown'&&['drive','fountain','studio','home'].includes(hash))openRoom(hash)});

function loop(){
  requestAnimationFrame(loop);
  if(interiorCanvas.style.display!=='none'){
    icontrols.update();irenderer.render(iscene,icamera);
  }
}
loop();

addEventListener('resize',()=>{
  irenderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  irenderer.setSize(innerWidth,innerHeight,false);
  icamera.aspect=innerWidth/innerHeight;icamera.updateProjectionMatrix();
  map.resize();
});
</script>
</body>
</html>
