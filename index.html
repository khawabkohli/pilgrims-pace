<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilgrim’s Pace — Khawab Kohli</title>
<meta name="description" content="Pilgrim’s Pace, a record by Khawab Kohli. Listen now.">
<meta property="og:title" content="Pilgrim’s Pace — Khawab Kohli">
<meta property="og:description" content="Listen now.">
<meta property="og:image" content="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg">
<meta name="theme-color" content="#17120b">
<style>
:root{
  --bg:#17120b;
  --text:#f2ead9;
  --muted:#c7b994;
  --faint:#9e9175;
  --rule:rgba(231,215,181,.18);
}
*{box-sizing:border-box}
html{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color-scheme:dark;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-width:280px;
  min-height:100vh;
  min-height:100svh;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:url('https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg') center/cover no-repeat;
  transform:scale(1.04);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(180deg,rgba(23,18,11,.84),rgba(23,18,11,.96));
}
.page{
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(22px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
}
.release{
  width:min(100%,1120px);
  margin:auto;
}
.cover{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  box-shadow:0 18px 60px rgba(0,0,0,.5);
}
.info{min-width:0}
.head{
  padding:20px 2px 17px;
  border-bottom:1px solid var(--rule);
}
.title{
  margin:0;
  font-family:Georgia,'Times New Roman',serif;
  font-weight:400;
  font-size:clamp(34px,10vw,48px);
  line-height:.96;
  letter-spacing:-.04em;
  overflow-wrap:anywhere;
}
.artist{
  margin-top:10px;
  font-size:11px;
  line-height:1.35;
  letter-spacing:.23em;
  text-transform:uppercase;
  color:var(--muted);
}
.links a{
  min-height:58px;
  padding:0 2px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid var(--rule);
  font-size:15px;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .18s ease,transform .18s ease;
}
.links a span:last-child{
  flex:0 0 auto;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}
.links a:focus-visible{
  outline:2px solid var(--muted);
  outline-offset:4px;
}
.foot{
  padding:18px 2px 1px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:9px;
  line-height:1.4;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--faint);
}
@media (hover:hover) and (pointer:fine){
  .links a:hover{opacity:.65;transform:translateX(2px)}
}

/* Phones + portrait tablets: stacked */
@media (max-width:839px){
  .release{max-width:590px}
  .foot{padding-bottom:6px}
}

/* iPads landscape + laptops + desktops: fit the whole release in one view */
@media (min-width:840px){
  .page{
    padding-top:max(28px,env(safe-area-inset-top));
    padding-bottom:max(28px,env(safe-area-inset-bottom));
  }
  .release{
    display:grid;
    grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);
    gap:clamp(34px,5vw,72px);
    align-items:center;
  }
  .cover{
    width:min(100%,66vh);
    justify-self:end;
  }
  .info{
    width:min(100%,430px);
    justify-self:start;
  }
  .head{padding:0 2px 21px}
  .title{font-size:clamp(46px,4.6vw,70px)}
  .artist{margin-top:13px}
  .links a{min-height:62px}
  .foot{padding-top:20px}
}

/* Short laptop windows */
@media (min-width:840px) and (max-height:720px){
  .release{gap:34px}
  .cover{width:min(100%,62vh)}
  .title{font-size:clamp(40px,4.2vw,58px)}
  .links a{min-height:52px}
  .head{padding-bottom:15px}
  .foot{padding-top:14px}
}

/* Small phones */
@media (max-width:420px){
  .page{
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
  }
  .title{font-size:clamp(31px,10vw,42px)}
  .links a{min-height:56px}
  .foot{flex-direction:column;gap:5px}
}

@media (prefers-reduced-motion:reduce){
  .links a{transition:none}
}
</style>
</head>
<body>
<div class="page">
  <main class="release">
    <img class="cover" src="https://i.ytimg.com/vi/ROwIV9T7IIc/maxresdefault.jpg" alt="Pilgrim’s Pace cover artwork">
    <section class="info">
      <header class="head">
        <h1 class="title">Pilgrim’s Pace</h1>
        <div class="artist">Khawab Kohli</div>
      </header>
      <nav class="links" aria-label="Listen to Pilgrim’s Pace">
        <a href="https://open.spotify.com/track/7lAKKJmumRbe8TNYyafqcz" target="_blank" rel="noopener noreferrer"><span>Spotify</span><span>Listen ↗</span></a>
        <a href="https://music.apple.com/au/album/pilgrims-pace-single/6816145484" target="_blank" rel="noopener noreferrer"><span>Apple Music</span><span>Listen ↗</span></a>
        <a href="https://music.youtube.com/watch?v=ROwIV9T7IIc" target="_blank" rel="noopener noreferrer"><span>YouTube Music</span><span>Listen ↗</span></a>
        <a href="https://music.amazon.com.au/albums/B0HKZ3QZ2M" target="_blank" rel="noopener noreferrer"><span>Amazon Music</span><span>Listen ↗</span></a>
        <a href="https://tidal.com/album/564211468/u" target="_blank" rel="noopener noreferrer"><span>TIDAL</span><span>Listen ↗</span></a>
      </nav>
      <footer class="foot"><span>A record by Khawab Kohli</span><span>2026</span></footer>
    </section>
  </main>
</div>
</body>
</html>
